name: Build NexaVideo APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find and Prepare Project
        run: |
          ls -la
          for f in *.zip; do
            if [ -f "$f" ]; then
              unzip -o "$f"
            fi
          done
          ls -la
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          echo "Found gradlew at: $GRADLEW_PATH"
          if [ -z "$GRADLEW_PATH" ]; then
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname $GRADLEW_PATH)" >> $GITHUB_ENV

      - name: Make Gradle executable
        run: chmod +x $PROJECT_DIR/gradlew

      - name: Build APK
        run: |
          cd $PROJECT_DIR
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexavideo-debug-apk
          path: "**/build/outputs/apk/**/*.apk"
