version: '3.8'
services:
  postgres:
    image: postgres:15
    environment: {POSTGRES_DB: nexavideo, POSTGRES_USER: nexa, POSTGRES_PASSWORD: nexa123}
    ports: ["5432:5432"]
    volumes: ["./db/init.sql:/docker-entrypoint-initdb.d/init.sql","pgdata:/var/lib/postgresql/data"]
  api:
    build: ./api
    ports: ["3000:3000"]
    env_file: ./api/.env.example
volumes: {pgdata: {}}

