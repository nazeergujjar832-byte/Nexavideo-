name: Build NexaVideo APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Unzip and Find Project
        run: |
          rm -rf project extracted || true
          ZIP=$(ls *.zip | head -n 1)
          unzip -o "$ZIP" -d extracted
          ANDROID_DIR=$(find extracted -type f -name "gradlew" | head -n 1 | xargs dirname)
          mkdir -p project
          cp -r $ANDROID_DIR/* project/
      - name: Build APK
        run: |
          cd project
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexaVideo-APK
          path: project/app/build/outputs/apk/debug/*.apk
