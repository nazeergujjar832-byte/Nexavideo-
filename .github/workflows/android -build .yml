name: Build Original - JVM 17 FORCED #15
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup SDK
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"
          cache-disabled: true

      - name: Restore Original + Force JVM 17
        run: |
          rm -rf project extracted || true
          unzip -o *.zip -d extracted
          ANDROID_DIR=$(find extracted -name "settings.gradle.kts" | head -n 1 | xargs dirname)
          mkdir -p project
          cp -r $ANDROID_DIR/. project/
          echo "sdk.dir=$ANDROID_HOME" > project/local.properties

          # Gradle properties clean
          cat > project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.jvm.toolchain=17
          EOF

          sed -i 's/\${allowCleartext}/true/g' project/app/src/main/AndroidManifest.xml || true

          python3 << 'PY'
          import pathlib, re
          path = pathlib.Path("project/app/build.gradle.kts")
          text = path.read_text()

          # 1. Remove old compileOptions and kotlinOptions completely to avoid duplicate
          text = re.sub(r'compileOptions\s*\{[^}]*\}', '', text, flags=re.DOTALL)
          text = re.sub(r'kotlinOptions\s*\{[^}]*\}', '', text, flags=re.DOTALL)

          # 2. Replace any 1.8 / 11 references
          text = text.replace("VERSION_1_8", "VERSION_17").replace("VERSION_11", "VERSION_17")
          text = text.replace('"1.8"', '"17"').replace("'1.8'", "'17'")

          # 3. Inject correct compileOptions + java toolchain right after android {
          inject = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              java {
                  toolchain {
                      languageVersion.set(JavaLanguageVersion.of(17))
                  }
              }
              kotlin {
                  jvmToolchain(17)
              }
          """
          text = text.replace("android {", "android {" + inject)

          path.write_text(text)
          print(text)
          PY

      - name: Build APK
        run: |
          cd project
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.9; fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NexaVideo-ORIGINAL-FIXED-15
          path: project/app/build/outputs/apk/debug/*.apk
