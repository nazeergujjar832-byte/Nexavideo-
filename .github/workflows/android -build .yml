name: Build Original NexaVideo - FIXED JVM
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup SDK
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"
          cache-disabled: true

      - name: Restore & FORCE JVM 17
        run: |
          rm -rf project extracted || true
          unzip -o *.zip -d extracted
          ANDROID_DIR=$(find extracted -name "settings.gradle.kts" | head -n 1 | xargs dirname)
          mkdir -p project
          cp -r $ANDROID_DIR/. project/
          echo "sdk.dir=$ANDROID_HOME" > project/local.properties
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" > project/gradle.properties
          echo "android.useAndroidX=true" >> project/gradle.properties
          echo "android.enableJetifier=true" >> project/gradle.properties
          sed -i 's/\${allowCleartext}/true/g' project/app/src/main/AndroidManifest.xml || true

          # --- YAHAN ASAL FIX HAI ---
          python3 << 'PY'
          import pathlib
          p = pathlib.Path("project/app/build.gradle.kts").read_text()
          # Sab jagah 1.8 aur 11 ko 17 karo
          p = p.replace("VERSION_1_8", "VERSION_17")
          p = p.replace("VERSION_11", "VERSION_17")
          p = p.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
          p = p.replace('jvmTarget = "11"', 'jvmTarget = "17"')
          p = p.replace('"1.8"', '"17"')
          p = p.replace("'1.8'", "'17'")
          # Agar compileOptions missing ho to add kar do
          if "sourceCompatibility" not in p:
              p = p.replace("compileSdk", "compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    compileSdk")
          print(p)
          pathlib.Path("project/app/build.gradle.kts").write_text(p)
          PY

          cat project/app/build.gradle.kts

      - name: Build
        run: |
          cd project
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.9; fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexaVideo-ORIGINAL-FIXED
          path: project/app/build/outputs/apk/debug/*.apk
