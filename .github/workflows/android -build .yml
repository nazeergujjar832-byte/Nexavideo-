name: Build Original NexaVideo
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup SDK
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"
          cache-disabled: true
      - name: Restore Original
        run: |
          rm -rf project extracted || true
          unzip -o *.zip -d extracted
          ANDROID_DIR=$(find extracted -name "settings.gradle.kts" | head -n 1 | xargs dirname)
          mkdir -p project
          cp -r $ANDROID_DIR/. project/
          echo "sdk.dir=$ANDROID_HOME" > project/local.properties
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" > project/gradle.properties
          echo "android.useAndroidX=true" >> project/gradle.properties
          echo "android.enableJetifier=true" >> project/gradle.properties
          sed -i 's/\${allowCleartext}/true/g' project/app/src/main/AndroidManifest.xml || true
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' project/app/build.gradle.kts || true
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' project/app/build.gradle.kts || true
      - name: Build Original APK
        run: |
          cd project
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.9; fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexaVideo-ORIGINAL-APK
          path: project/app/build/outputs/apk/debug/*.apk
