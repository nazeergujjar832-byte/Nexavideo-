name: Build NexaVideo APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup SDK
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"
      - name: Unzip & Fix ALL Missing
        run: |
          rm -rf project extracted || true
          unzip -o *.zip -d extracted
          ANDROID_DIR=$(find extracted -name "settings.gradle.kts" | head -n 1 | xargs dirname)
          mkdir -p project
          cp -r $ANDROID_DIR/. project/
          
          # gradle.properties
          cat > project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          echo "sdk.dir=$ANDROID_HOME" > project/local.properties

          # --- MAIN FIX: app/build.gradle.kts me JVM 17 set karo ---
          cat > project/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.nexavideo"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.nexavideo.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 7
                  versionName = "1.2.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.compose.ui:ui:1.7.8")
              implementation("androidx.compose.material3:material3:1.3.1")
              implementation("androidx.activity:activity-compose:1.10.1")
              implementation("androidx.navigation:navigation-compose:2.8.5")
              implementation("androidx.media3:media3-exoplayer:1.5.1")
              implementation("androidx.media3:media3-ui:1.5.1")
              implementation("com.squareup.retrofit2:retrofit:2.9.0")
              implementation("com.squareup.retrofit2:converter-gson:2.9.0")
          }
          EOF

          # Minimal working MainActivity
          mkdir -p project/app/src/main/java/com/nexavideo/data
          cat > project/app/src/main/java/com/nexavideo/MainActivity.kt <<'EOF'
          package com.nexavideo
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { Text("NexaVideo - Fixed Build #11") }
              }
          }
          EOF
          echo 'package com.nexavideo.data; object Api { const val BASE_URL = "https://api.nexavideo.com/" }' > project/app/src/main/java/com/nexavideo/data/Api.kt
          echo 'package com.nexavideo.data; class ApiClient' > project/app/src/main/java/com/nexavideo/data/ApiClient.kt
          mkdir -p project/app/src/main/java/com/nexavideo/ai
          echo 'package com.nexavideo.ai; class AiCaptionService' > project/app/src/main/java/com/nexavideo/ai/AiCaptionService.kt

      - name: Build APK
        run: |
          cd project
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.9; fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexaVideo-APK-Final
          path: project/app/build/outputs/apk/debug/*.apk
