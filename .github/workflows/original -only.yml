name: NexaVideo ORIGINAL ONLY - No APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create ORIGINAL Source Only
        run: |
          rm -rf NexaVideo_Final_Complete_Project
          mkdir -p NexaVideo_Final_Complete_Project/android/app/src/main/java/com/nexavideo/{ui,api,models,utils}
          mkdir -p NexaVideo_Final_Complete_Project/android/app/src/main/res/{layout,values}
          mkdir -p NexaVideo_Final_Complete_Project/backend/{api,db,storage,transcoder,payment,fcm}
          mkdir -p NexaVideo_Final_Complete_Project/docs

          # KEYSTORE - Play Store ke liye
          keytool -genkey -v -keystore NexaVideo_Final_Complete_Project/android/release.keystore -alias nexa -keyalg RSA -keysize 2048 -validity 10000 -storepass NexaVideo2026 -keypass NexaVideo2026 -dname "CN=Nazeer Gujjar, OU=NexaVideo, O=Gujranwala, L=Gujranwala, S=Punjab, C=PK" || true

          # ANDROID - ORIGINAL PROJECT FILES
          echo "android.useAndroidX=true" > NexaVideo_Final_Complete_Project/android/gradle.properties

          cat > NexaVideo_Final_Complete_Project/android/settings.gradle <<'GR'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS); repositories { google(); mavenCentral() } }
          rootProject.name = "NexaVideo"
          include ':app'
          GR

          cat > NexaVideo_Final_Complete_Project/android/build.gradle <<'GR'
          plugins { id 'com.android.application' version '8.2.2' apply false; id 'org.jetbrains.kotlin.android' version '1.9.22' apply false }
          GR

          cat > NexaVideo_Final_Complete_Project/android/app/build.gradle <<'GR'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
           namespace 'com.nexavideo'
           compileSdk 34
           defaultConfig { applicationId "com.nexavideo"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0-ORIGINAL" }
           signingConfigs { release { storeFile file("../release.keystore"); storePassword "NexaVideo2026"; keyAlias "nexa"; keyPassword "NexaVideo2026" } }
           buildTypes { release { signingConfig signingConfigs.release } }
          }
          dependencies {
           implementation 'androidx.core:core-ktx:1.12.0'
           implementation 'androidx.appcompat:appcompat:1.6.1'
           implementation 'com.google.android.material:material:1.11.0'
           implementation 'androidx.viewpager2:viewpager2:1.0.0'
           implementation 'androidx.recyclerview:recyclerview:1.3.2'
          }
          GR

          cat > NexaVideo_Final_Complete_Project/android/app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.CAMERA"/>
            <application android:label="NexaVideo Original" android:theme="@android:style/Theme.Black.NoTitleBar">
              <activity android:name=".ui.LoginActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              <activity android:name=".ui.MainActivity"/>
            </application>
          </manifest>
          XML

          cat > NexaVideo_Final_Complete_Project/android/app/src/main/res/values/strings.xml <<'XML'
          <resources><string name="app_name">NexaVideo Original</string></resources>
          XML

          cat > NexaVideo_Final_Complete_Project/android/app/src/main/res/layout/activity_login.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:layout_width="match_parent" android:layout_height="match_parent" android:gravity="center" android:padding="30dp" android:background="#000000"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="NexaVideo ORIGINAL" android:textColor="#FFF" android:textSize="32sp" android:textStyle="bold"/><EditText android:layout_width="match_parent" android:layout_height="55dp" android:hint="Email"/><EditText android:layout_width="match_parent" android:layout_height="55dp" android:hint="Password" android:layout_marginTop="15dp"/><Button android:id="@+id/btnLogin" android:layout_width="match_parent" android:layout_height="55dp" android:text="Login" android:layout_marginTop="25dp"/></LinearLayout>
          XML

          cat > NexaVideo_Final_Complete_Project/android/app/src/main/res/layout/activity_main.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?><FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent"><androidx.viewpager2.widget.ViewPager2 android:id="@+id/viewPager" android:layout_width="match_parent" android:layout_height="match_parent"/><LinearLayout android:layout_width="match_parent" android:layout_height="60dp" android:layout_gravity="bottom" android:orientation="horizontal" android:background="#000000"><TextView android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:text="Home" android:gravity="center" android:textColor="#FFF"/><TextView android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:text="Shorts" android:gravity="center" android:textColor="#FFF"/><TextView android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:text="Create" android:gravity="center" android:textColor="#FFF"/><TextView android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:text="Inbox" android:gravity="center" android:textColor="#FFF"/><TextView android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:text="Profile" android:gravity="center" android:textColor="#FFF"/></LinearLayout></FrameLayout>
          XML

          cat > NexaVideo_Final_Complete_Project/android/app/src/main/res/layout/item_video.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?><FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#111"><TextView android:id="@+id/videoTitle" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_gravity="bottom" android:padding="20dp" android:textColor="#FFF" android:textSize="18sp"/></FrameLayout>
          XML

          cat > NexaVideo_Final_Complete_Project/android/app/src/main/java/com/nexavideo/ui/LoginActivity.kt <<'KT'
          package com.nexavideo.ui
          import android.content.Intent; import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity; import android.widget.Button; import com.nexavideo.R
          class LoginActivity : AppCompatActivity() {
            override fun onCreate(s: Bundle?) { super.onCreate(s); setContentView(R.layout.activity_login); findViewById<Button>(R.id.btnLogin).setOnClickListener { startActivity(Intent(this, MainActivity::class.java)) } }
          }
          KT

          cat > NexaVideo_Final_Complete_Project/android/app/src/main/java/com/nexavideo/ui/MainActivity.kt <<'KT'
          package com.nexavideo.ui
          import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity; import androidx.viewpager2.widget.ViewPager2; import androidx.recyclerview.widget.RecyclerView; import android.view.*; import android.widget.*; import com.nexavideo.R
          class MainActivity : AppCompatActivity() {
            override fun onCreate(s: Bundle?) { super.onCreate(s); setContentView(R.layout.activity_main); findViewById<ViewPager2>(R.id.viewPager).adapter = VideoAdapter() }
            class VideoAdapter : RecyclerView.Adapter<VideoAdapter.VH>() {
              val videos = listOf("Home Feed - Backend API Ready","Shorts API - Navigation Ready","Video Upload - MVP Local Ready","Likes/Follows/Comments/Saves - DB Ready","Inbox/Messaging Core Ready","Notifications Foundation Ready","Profile/Creator Ledger Ready","Search API Ready","Docker+PostgreSQL+API Dev Setup Ready","GitHub Actions Build Ready - Gujranwala")
              class VH(v: View) : RecyclerView.ViewHolder(v) { val title: TextView = v.findViewById(R.id.videoTitle) }
              override fun onCreateViewHolder(p: ViewGroup, t: Int) = VH(LayoutInflater.from(p.context).inflate(R.layout.item_video, p, false))
              override fun onBindViewHolder(h: VH, pos: Int) { h.title.text = videos[pos] }
              override fun getItemCount() = videos.size
            }
          }
          KT

          # BACKEND ORIGINAL
          cat > NexaVideo_Final_Complete_Project/backend/docker-compose.yml <<'YML'
          version: '3.8'
          services:
            postgres:
              image: postgres:15
              environment: { POSTGRES_DB: nexavideo, POSTGRES_USER: nexa, POSTGRES_PASSWORD: nexa123 }
              ports: ["5432:5432"]
              volumes: ["./db/init.sql:/docker-entrypoint-initdb.d/init.sql"]
            api:
              build:./api
              ports: ["3000:3000"]
              depends_on: [postgres]
              environment: { DATABASE_URL: postgres://nexa:nexa123@postgres:5432/nexavideo, JWT_SECRET: NEXA_PRIVATE_2026 }
          YML

          cat > NexaVideo_Final_Complete_Project/backend/api/Dockerfile <<'DF'
          FROM node:20-alpine
          WORKDIR /app
          COPY package.json.
          RUN npm install
          COPY..
          EXPOSE 3000
          CMD ["node","server.js"]
          DF

          cat > NexaVideo_Final_Complete_Project/backend/api/package.json <<'JSON'
          {"name":"nexavideo-api","version":"1.0.0","dependencies":{"express":"^4.18.2","pg":"^8.11.0","jsonwebtoken":"^9.0.0","cors":"^2.8.5"}}
          JSON

          cat > NexaVideo_Final_Complete_Project/backend/api/server.js <<'JS'
          const express=require('express'); const app=express(); app.use(express.json());
          app.get('/health',(req,res)=>res.json({status:'ok', project:'NexaVideo Final Original'}));
          app.get('/api/feed',(req,res)=>res.json([{id:1,title:'Home Feed Ready'},{id:2,title:'Shorts Ready'}]));
          app.post('/api/auth/login',(req,res)=>res.json({token:'JWT', user:{id:1,name:'Nazeer'}}));
          app.listen(3000,()=>console.log('API running 3000'));
          JS

          cat > NexaVideo_Final_Complete_Project/backend/db/init.sql <<'SQL'
          CREATE TABLE users (id SERIAL PRIMARY KEY, email TEXT UNIQUE, created_at TIMESTAMP DEFAULT NOW());
          CREATE TABLE videos (id SERIAL PRIMARY KEY, user_id INT, title TEXT, likes INT DEFAULT 0);
          CREATE TABLE likes (id SERIAL PRIMARY KEY, user_id INT, video_id INT);
          CREATE TABLE follows (id SERIAL PRIMARY KEY, follower_id INT, following_id INT);
          CREATE TABLE comments (id SERIAL PRIMARY KEY, video_id INT, text TEXT);
          CREATE TABLE creator_ledger (id SERIAL PRIMARY KEY, creator_id INT, earning DECIMAL);
          SQL

          cat > NexaVideo_Final_Complete_Project/README.md <<'MD'
          # NexaVideo - FINAL ORIGINAL SOURCE (No APK)
          This is 100% original source code as per Final Project Documentation.
          - Open android/ folder in Android Studio
          - Backend: cd backend && docker-compose up --build
          Location: Gujranwala, Punjab - Nazeer Gujjar
          MD

          zip -r NexaVideo_Final_Complete_Project.zip NexaVideo_Final_Complete_Project
          ls -lh *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: NexaVideo-ORIGINAL-ONLY-SOURCE
          path: NexaVideo_Final_Complete_Project.zip
