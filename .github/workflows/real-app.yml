name: NexaVideo Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          rm -rf NexaApp
          mkdir -p NexaApp/app/src/main/java/com/nexavideo
          printf 'android.useAndroidX=true\n' > NexaApp/gradle.properties
          printf 'rootProject.name="NexaVideo"\ninclude ":app"\n' > NexaApp/settings.gradle
          printf 'plugins { id "com.android.application" version "8.2.2" apply false }\n' > NexaApp/build.gradle
          printf 'plugins { id "com.android.application" }\nandroid { namespace "com.nexavideo"; compileSdk 34; defaultConfig { applicationId "com.nexavideo"; minSdk 24; targetSdk 34; versionCode 3; versionName "3.0" } }\ndependencies { implementation "androidx.core:core-ktx:1.12.0"; implementation "androidx.appcompat:appcompat:1.6.1" }\n' > NexaApp/app/build.gradle
          printf '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="NexaVideo"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > NexaApp/app/src/main/AndroidManifest.xml
          printf 'package com.nexavideo\nimport android.os.Bundle\nimport androidx.appcompat.app.AppCompatActivity\nimport android.widget.TextView\nclass MainActivity : AppCompatActivity() { override fun onCreate(s: Bundle?) { super.onCreate(s); val tv = TextView(this); tv.text = "NexaVideo TIKTOK v3\nPrivate API OK\nNazeer Gujjar - Gujranwala"; tv.textSize = 22f; tv.setPadding(40,300,40,40); setContentView(tv) } }\n' > NexaApp/app/src/main/java/com/nexavideo/MainActivity.kt
          echo "sdk.dir=$ANDROID_HOME" > NexaApp/local.properties
          cd NexaApp
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NexaVideo-APK-Fixed
          path: NexaApp/app/build/outputs/apk/debug/*.apk
