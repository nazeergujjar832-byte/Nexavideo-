name: NexaVideo Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          rm -rf NexaApp
          mkdir -p NexaApp/app/src/main/java/com/nexavideo
          echo "rootProject.name=\"NexaVideo\"" > NexaApp/settings.gradle
          echo "include ':app'" >> NexaApp/settings.gradle
          cat > NexaApp/app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' id 'org.jetbrains.kotlin.android' }
          android { namespace 'com.nexavideo'; compileSdk 34; defaultConfig { applicationId "com.nexavideo"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" } }
          dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.material:material:1.11.0' }
          GRADLE
          mkdir -p NexaApp/app/src/main
          cat > NexaApp/app/src/main/AndroidManifest.xml <<'MANI'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="NexaVideo" android:theme="@android:style/Theme.Light"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          MANI
          cat > NexaApp/app/src/main/java/com/nexavideo/MainActivity.kt <<'KOT'
          package com.nexavideo
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import android.widget.TextView
          class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              val tv = TextView(this)
              tv.text = "NexaVideo - REAL APP v25\nCreate. Watch. Connect.\nPrivate Web Service: Ready\nDeveloper: Nazeer Gujjar"
              tv.textSize = 20f
              tv.setPadding(50,200,50,50)
              setContentView(tv)
            }
          }
          KOT
          echo "sdk.dir=$ANDROID_HOME" > NexaApp/local.properties
          cd NexaApp
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexaVideo-APK
          path: NexaApp/app/build/outputs/apk/debug/*.apk
