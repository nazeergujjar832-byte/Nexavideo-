name: NexaVideo Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          python3 << 'PY'
          import os
          os.system("rm -rf NexaApp && mkdir -p NexaApp/app/src/main/java/com/nexavideo")
          open("NexaApp/gradle.properties","w").write("android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\n")
          open("NexaApp/settings.gradle","w").write('''
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS); repositories { google(); mavenCentral() } }
          rootProject.name = "NexaVideo"
          include ':app'
          ''')
          open("NexaApp/build.gradle","w").write('''
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          ''')
          open("NexaApp/app/build.gradle","w").write('''
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.nexavideo'
              compileSdk 34
              defaultConfig { applicationId "com.nexavideo"; minSdk 24; targetSdk 34; versionCode 4; versionName "4.0-Fixed" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          ''')
          open("NexaApp/app/src/main/AndroidManifest.xml","w").write('<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="NexaVideo" android:theme="@android:style/Theme.Light"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>')
          open("NexaApp/app/src/main/java/com/nexavideo/MainActivity.kt","w").write('''
          package com.nexavideo
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import android.widget.TextView
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv = TextView(this)
                  tv.text = "NexaVideo v4 FIXED\\nBuild Success!\\nPrivate API: ACTIVE\\nNazeer Gujjar - Gujranwala - 100%"
                  tv.textSize = 22f
                  tv.setPadding(40, 300, 40, 40)
                  setContentView(tv)
              }
          }
          ''')
          PY
          echo "sdk.dir=$ANDROID_HOME" > NexaApp/local.properties
          cd NexaApp
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NexaVideo-APK-FIXED
          path: NexaApp/app/build/outputs/apk/debug/*.apk
