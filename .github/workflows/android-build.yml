name: Build NexaVideo APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build APK
        run: |
          unzip -o "NexaVideo_Super_App_28_Modules.zip"
          FILE=$(find . -name gradlew -type f | head -n 1)
          echo "Found: $FILE"
          DIR=$(dirname "$FILE")
          chmod +x "$DIR/gradlew"
          cd "$DIR" && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexaVideo-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
