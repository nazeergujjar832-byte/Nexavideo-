name: Build NexaVideo APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Unzip
        run: |
          unzip -o NexaVideo_Super_App_28_Modules.zip
          echo "PROJECT_DIR=$(dirname $(find . -name gradlew | head -n 1))" >> $GITHUB_ENV
      - run: chmod +x $PROJECT_DIR/gradlew
      - run: cd $PROJECT_DIR && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NexaVideo-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
