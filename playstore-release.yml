name: Play Store Release AAB #20
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup SDK
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Create Keystore for Play Store
        run: |
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -storepass nexa123 -keypass nexa123 -dname "CN=NexaVideo, OU=Dev, O=Nexa, C=PK" -alias nexa
          ls -lh release.jks

      - name: Build Release AAB
        run: |
          if [ ! -d "project/app" ]; then
            echo "Project nahi mila, pehle #19 chalao"
            exit 1
          fi
          cd project
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          cat > app/build.gradle.kts <<'EOF'
          plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("kotlin-parcelize")
          }
          android {
            namespace = "com.nexavideo"
            compileSdk = 35
            defaultConfig {
              applicationId = "com.nexavideo"
              minSdk = 24
              targetSdk = 35
              versionCode = 20
              versionName = "20.0-PLAYSTORE"
            }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
            kotlin { jvmToolchain(17) }
            signingConfigs {
              create("release") {
                storeFile = file("../release.jks")
                storePassword = "nexa123"
                keyAlias = "nexa"
                keyPassword = "nexa123"
              }
            }
            buildTypes {
              getByName("debug") { isDebuggable = true }
              getByName("release") {
                isMinifyEnabled = false
                signingConfig = signingConfigs.getByName("release")
              }
            }
            buildFeatures { compose = true }
            composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
            implementation("androidx.activity:activity-compose:1.10.1")
            implementation(platform("androidx.compose:compose-bom:2024.10.00"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.ui:ui-tooling-preview")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.material:material-icons-extended")
            implementation("androidx.navigation:navigation-compose:2.8.5")
            implementation("androidx.datastore:datastore-preferences:1.1.1")
            implementation("androidx.media3:media3-exoplayer:1.5.1")
            implementation("androidx.media3:media3-ui:1.5.1")
            implementation("androidx.media3:media3-common:1.5.1")
            implementation("com.squareup.retrofit2:retrofit:2.11.0")
            implementation("com.squareup.retrofit2:converter-gson:2.11.0")
            implementation("com.squareup.okhttp3:okhttp:4.12.0")
            implementation("com.google.code.gson:gson:2.10.1")
          }
          EOF

          cp ../release.jks ./
          chmod +x gradlew || gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          ./gradlew assembleRelease --no-daemon

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: NexaVideo-PlayStore-AAB-Ready
          path: |
            project/app/build/outputs/bundle/release/*.aab
            project/app/build/outputs/apk/release/*.apk
            release.jks
