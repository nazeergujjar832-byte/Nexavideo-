<!DOCTYPE html>
<html lang="ur">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXAVIDEO - Live</title>
<style>body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}h1{text-align:center;padding:15px;font-size:24px}h1 span{color:#fe2c55}.feed{height:90vh;overflow-y:scroll;scroll-snap-type:y mandatory;max-width:420px;margin:auto}.card{height:90vh;scroll-snap-align:start;position:relative}.card video{width:100%;height:100%;object-fit:cover}.info{position:absolute;bottom:20px;left:10px}</style></head>
<body>
<h1><span>NEXA</span>VIDEO - PDF SYSTEM ✅</h1>
<div class="feed">
<div class="card"><video src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" autoplay muted loop></video><div class="info"><b>@nexa_official</b><p>Original PDF system live hai 🚀</p></div></div>
<div class="card"><video src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" loop></video><div class="info"><b>@ghakhar_boy</b><p>Swipe karo, TikTok jaisa!</p></div></div>
</div>
<script>
const obs=new IntersectionObserver(es=>{es.forEach(e=>{let v=e.target.querySelector('video');if(e.isIntersecting){document.querySelectorAll('video').forEach(x=>x.pause());v.play()}else v.pause()})},{threshold:0.6});
document.querySelectorAll('.card').forEach(c=>obs.observe(c));
</script>
</body>
                    </html>
